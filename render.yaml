services:
  - type: web
    name: oficina-mecanica
    env: node
    plan: free
    buildCommand: pnpm install && BASE_PATH=/ PORT=3000 pnpm --filter @workspace/oficina run build && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/db run push && node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PORT
        value: 10000
