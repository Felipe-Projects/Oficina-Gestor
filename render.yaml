services:
  - type: web
    name: oficina-mecanica
    env: node
    plan: free
    buildCommand: pnpm install && pnpm run build:production
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PORT
        value: 10000
