kind = "mobile"
previewPath = "/mobile/"
title = "Oficina Pro Mobile"
version = "1.0.0"
id = "artifacts/oficina-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 22483

[services.development]
run = "pnpm --filter @workspace/oficina-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/oficina-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/oficina-mobile", "run", "serve" ]

[services.env]
PORT = "22483"
BASE_PATH = "/mobile/"
